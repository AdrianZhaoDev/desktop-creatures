[package]
name = "desktop-creatures"
version = "1.1.0"
description = "A transparent desktop habitat for small 3D creatures"
authors = ["Desktop Creatures contributors"]
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_creatures_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
# Campaign JSON crosses JavaScript/Rust repeatedly; parsing must preserve f64 bits.
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The isolated embedding probe uses the exact code generator and locked codecs.
brotli = { version = "=8.0.4", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full"] }
tauri-codegen = { version = "=2.6.3", features = ["compression"] }
tauri-utils = { version = "=2.9.3", features = ["build-2", "compression"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
